openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BrandOps API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: campaigns
    description: Campaign management
  - name: creators
    description: Creator management
  - name: submissions
    description: Submission management
  - name: payments
    description: Payment management
  - name: dashboard
    description: Dashboard and analytics
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /openai/conversations/{id}/voice-messages:
    post:
      operationId: sendOpenaiVoiceMessage
      tags: [openai]
      summary: Send audio and receive a streaming voice response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiVoiceMessageInput"
      responses:
        "200":
          description: SSE stream of transcript and audio chunks
          content:
            text/event-stream: {}
  /openai/generate-image:
    post:
      operationId: generateOpenaiImage
      tags: [openai]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiImageInput"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiImageOutput"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List all campaigns
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, completed, archived]
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a new campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Not found
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns/{id}/publish:
    post:
      operationId: publishCampaign
      tags: [campaigns]
      summary: Publish a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}/stats:
    get:
      operationId: getCampaignStats
      tags: [campaigns]
      summary: Get campaign-level statistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignStats"

  /creators:
    get:
      operationId: listCreators
      tags: [creators]
      summary: List all creators
      parameters:
        - name: platform
          in: query
          schema:
            type: string
            enum: [tiktok, instagram, youtube]
        - name: niche
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of creators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Creator"
    post:
      operationId: createCreator
      tags: [creators]
      summary: Register a new creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorInput"
      responses:
        "201":
          description: Created creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"

  /creators/{id}:
    get:
      operationId: getCreator
      tags: [creators]
      summary: Get a creator by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"
        "404":
          description: Not found
    patch:
      operationId: updateCreator
      tags: [creators]
      summary: Update a creator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorUpdate"
      responses:
        "200":
          description: Updated creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creator"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List submissions
      parameters:
        - name: campaignId
          in: query
          schema:
            type: integer
        - name: creatorId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewing, approved, revision_requested, paid, rejected]
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a video for a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Created submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/{id}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Get a submission by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "404":
          description: Not found
    patch:
      operationId: updateSubmission
      tags: [submissions]
      summary: Update a submission (approve/reject/request revision)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List all payments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, paid, failed]
        - name: creatorId
          in: query
          schema:
            type: integer
        - name: campaignId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment for an approved submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /analytics:
    get:
      operationId: getAnalytics
      tags: [dashboard]
      summary: Get aggregate analytics
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardStats:
      type: object
      required:
        - totalSpend
        - activeCampaigns
        - pendingSubmissions
        - approvedVideos
        - totalCreators
        - totalPayouts
        - campaignBudgetUsed
      properties:
        totalSpend:
          type: number
        activeCampaigns:
          type: integer
        pendingSubmissions:
          type: integer
        approvedVideos:
          type: integer
        totalCreators:
          type: integer
        totalPayouts:
          type: number
        campaignBudgetUsed:
          type: number

    ActivityItem:
      type: object
      required:
        - id
        - type
        - message
        - createdAt
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [submission, approval, rejection, payment, campaign_created, creator_joined]
        message:
          type: string
        entityId:
          type: ["integer", "null"]
        entityType:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    Campaign:
      type: object
      required:
        - id
        - title
        - description
        - totalBudget
        - payoutPerVideo
        - platform
        - niche
        - status
        - deadline
        - videosNeeded
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        totalBudget:
          type: number
        payoutPerVideo:
          type: number
        platform:
          type: string
          enum: [tiktok, instagram, youtube]
        niche:
          type: string
        status:
          type: string
          enum: [draft, active, paused, completed, archived]
        deadline:
          type: string
          format: date-time
        inspirationUrls:
          type: ["string", "null"]
        videoStyle:
          type: string
        tone:
          type: string
        videosNeeded:
          type: integer
        creatorType:
          type: string
        creatorCount:
          type: integer
        approvedCount:
          type: integer
        pendingCount:
          type: integer
        totalSpent:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignInput:
      type: object
      required:
        - title
        - description
        - totalBudget
        - payoutPerVideo
        - platform
        - deadline
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        totalBudget:
          type: number
        payoutPerVideo:
          type: number
        platform:
          type: string
          enum: [tiktok, instagram, youtube]
        niche:
          type: string
        deadline:
          type: string
          format: date-time
        inspirationUrls:
          type: string
        videoStyle:
          type: string
        tone:
          type: string
        videosNeeded:
          type: integer
        creatorType:
          type: string

    CampaignUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        totalBudget:
          type: number
        payoutPerVideo:
          type: number
        platform:
          type: string
          enum: [tiktok, instagram, youtube]
        niche:
          type: string
        deadline:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, active, paused, completed, archived]
        inspirationUrls:
          type: string
        videoStyle:
          type: string
        tone:
          type: string
        videosNeeded:
          type: integer
        creatorType:
          type: string

    CampaignStats:
      type: object
      required:
        - campaignId
        - totalSubmissions
        - approvedSubmissions
        - pendingSubmissions
        - rejectedSubmissions
        - totalSpent
        - budgetRemaining
        - creatorCount
      properties:
        campaignId:
          type: integer
        totalSubmissions:
          type: integer
        approvedSubmissions:
          type: integer
        pendingSubmissions:
          type: integer
        rejectedSubmissions:
          type: integer
        totalSpent:
          type: number
        budgetRemaining:
          type: number
        creatorCount:
          type: integer

    Creator:
      type: object
      required:
        - id
        - name
        - email
        - platform
        - handle
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, youtube]
        handle:
          type: string
        niche:
          type: string
        followerCount:
          type: integer
        engagementRate:
          type: number
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, suspended]
        approvalRate:
          type: number
        revisionRate:
          type: number
        completedCampaigns:
          type: integer
        onTimeDeliveryRate:
          type: number
        avgTurnaroundDays:
          type: number
        brandRating:
          type: number
        suggestedPayout:
          type: number
        contentStyles:
          type: array
          items:
            type: string
        totalEarnings:
          type: number
        approvedVideos:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatorInput:
      type: object
      required:
        - name
        - email
        - platform
        - handle
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, youtube]
        handle:
          type: string
        niche:
          type: string
        followerCount:
          type: integer
        engagementRate:
          type: number
        avatarUrl:
          type: string
        approvalRate:
          type: number
        revisionRate:
          type: number
        completedCampaigns:
          type: integer
        onTimeDeliveryRate:
          type: number
        avgTurnaroundDays:
          type: number
        brandRating:
          type: number
        suggestedPayout:
          type: number
        contentStyles:
          type: array
          items:
            type: string

    CreatorUpdate:
      type: object
      properties:
        name:
          type: string
        platform:
          type: string
          enum: [tiktok, instagram, youtube]
        handle:
          type: string
        niche:
          type: string
        followerCount:
          type: integer
        engagementRate:
          type: number
        avatarUrl:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        approvalRate:
          type: number
        revisionRate:
          type: number
        completedCampaigns:
          type: integer
        onTimeDeliveryRate:
          type: number
        avgTurnaroundDays:
          type: number
        brandRating:
          type: number
        suggestedPayout:
          type: number
        contentStyles:
          type: array
          items:
            type: string

    Submission:
      type: object
      required:
        - id
        - campaignId
        - creatorId
        - videoUrl
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        campaignId:
          type: integer
        creatorId:
          type: integer
        videoUrl:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, reviewing, approved, revision_requested, paid, rejected]
        notes:
          type: ["string", "null"]
        payoutAmount:
          type: ["number", "null"]
        campaign:
          $ref: "#/components/schemas/Campaign"
        creator:
          $ref: "#/components/schemas/Creator"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SubmissionInput:
      type: object
      required:
        - campaignId
        - creatorId
        - videoUrl
      properties:
        campaignId:
          type: integer
        creatorId:
          type: integer
        videoUrl:
          type: string
        thumbnailUrl:
          type: string

    SubmissionUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, reviewing, approved, revision_requested, paid, rejected]
        notes:
          type: string
        payoutAmount:
          type: number

    Payment:
      type: object
      required:
        - id
        - submissionId
        - creatorId
        - campaignId
        - amount
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        submissionId:
          type: integer
        creatorId:
          type: integer
        campaignId:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [pending, processing, paid, failed]
        paidAt:
          type: ["string", "null"]
          format: date-time
        creator:
          $ref: "#/components/schemas/Creator"
        campaign:
          $ref: "#/components/schemas/Campaign"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentInput:
      type: object
      required:
        - submissionId
        - creatorId
        - campaignId
        - amount
      properties:
        submissionId:
          type: integer
        creatorId:
          type: integer
        campaignId:
          type: integer
        amount:
          type: number

    PaymentUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, processing, paid, failed]

    Analytics:
      type: object
      required:
        - totalBudget
        - approvedPayouts
        - pendingApprovals
        - videosDelivered
        - videosApproved
        - approvalRate
        - avgDeliveryDays
        - revisionRequests
        - costPerApprovedVideo
        - budgetRemaining
        - monthlySpend
        - topCreators
        - fastestCreators
        - creatorsNeedingAttention
      properties:
        totalBudget:
          type: number
        approvedPayouts:
          type: number
        pendingApprovals:
          type: integer
        videosDelivered:
          type: integer
        videosApproved:
          type: integer
        approvalRate:
          type: number
        avgDeliveryDays:
          type: number
        revisionRequests:
          type: integer
        costPerApprovedVideo:
          type: number
        budgetRemaining:
          type: number
        monthlySpend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlySpend"
        topCreators:
          type: array
          items:
            $ref: "#/components/schemas/CreatorStat"
        fastestCreators:
          type: array
          items:
            $ref: "#/components/schemas/CreatorStat"
        creatorsNeedingAttention:
          type: array
          items:
            $ref: "#/components/schemas/CreatorStat"

    CreatorStat:
      type: object
      required:
        - id
        - name
        - handle
        - platform
        - metric
        - metricLabel
      properties:
